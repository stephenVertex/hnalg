[project]
name = "hnalg"
version = "0.1.0"
description = "HackerNews Algolia search CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hnalg = "hnalg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hnalg"]
